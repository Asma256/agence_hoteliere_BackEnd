# ============================================================
# APPLICATION
# ============================================================
spring.application.name=agence-hoteliere-backend
server.port=8081

# ============================================================
# BASE DE DONNÉES MYSQL
# ============================================================
# createDatabaseIfNotExist=true : crée la base si elle n'existe pas
spring.datasource.url=jdbc:mysql://localhost:3306/agence_hoteliere?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================
# update : crée/met à jour les tables sans supprimer les données
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Évite les requêtes lazy pendant la sérialisation JSON (bonne pratique)
spring.jpa.open-in-view=false

